j100_0796:
  amcl:
    ros__parameters:
      use_sim_time: false
      tf_broadcast: true

      global_frame_id: "map"
      odom_frame_id: "odom"
      base_frame_id: "base_link"

      scan_topic: "/j100_0796/sensors/lidar2d_0/scan"
      scan_queue_size: 10

      min_particles: 50
      max_particles: 150
      resample_interval: 1

      update_min_d: 0.20
      update_min_a: 0.20
      transform_tolerance: 0.5

      laser_max_beams: 40
      laser_min_range: 0.05
      laser_max_range: 20.0
      max_beams: 20

      set_initial_pose: false
      always_reset_initial_pose: false
      first_map_only: false

      alpha1: 0.2
      alpha2: 0.2
      alpha3: 0.2
      alpha4: 0.2
      alpha5: 0.2

      z_hit: 0.5
      z_short: 0.05
      z_max: 0.05
      z_rand: 0.5
      sigma_hit: 0.2
      lambda_short: 0.1
      laser_likelihood_max_dist: 2.0

      do_beamskip: false
      beam_skip_distance: 0.5
      beam_skip_threshold: 0.3
      beam_skip_error_threshold: 0.9

      recovery_alpha_slow: 0.0
      recovery_alpha_fast: 0.0

      robot_model_type: "nav2_amcl::DifferentialMotionModel"
      save_pose_rate: 0.5

  map_server:
    ros__parameters:
      use_sim_time: false
      yaml_filename: "/home/administrator/jackal_clearpath_ws/maps/map_2.yaml"

  lifecycle_manager_localization:
    ros__parameters:
      use_sim_time: false
      autostart: true
      node_names: ["map_server", "amcl"]
