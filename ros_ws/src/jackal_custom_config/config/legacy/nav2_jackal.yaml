amcl:
  ros__parameters:
    use_sim_time: false
    tf_broadcast: true

    # Frames
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"

    # Laser
    scan_topic: "/j100_0796/sensors/lidar2d_0/scan"
    scan_queue_size: 50

    # Particle filter (debug-stable, not crazy heavy)
    min_particles: 200
    max_particles: 1000
    resample_interval: 1

    # Motion update thresholds
    update_min_d: 0.10
    update_min_a: 0.10

    # Laser model load reduction (helps queue full issues)
    laser_max_beams: 60

    # TF timing slack
    transform_tolerance: 1.0
    tf_buffer_duration: 20.0

    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0


map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/home/administrator/maps/jackal_map.yaml"


planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0

    # TF timing slack
    transform_tolerance: 1.0
    tf_buffer_duration: 20.0

    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true


controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0

    # TF timing slack
    transform_tolerance: 1.0
    tf_buffer_duration: 20.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001

    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      min_vel_x: 0.0
      max_vel_x: 0.35
      max_vel_theta: 1.2

      min_speed_xy: 0.0
      max_speed_xy: 0.35
      min_speed_theta: 0.0

      acc_lim_x: 1.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.0
      decel_lim_theta: -2.0

      vx_samples: 20
      vtheta_samples: 20
      sim_time: 1.5

      linear_granularity: 0.05
      angular_granularity: 0.025

      # DWB transform tolerance (separate from controller_server)
      transform_tolerance: 1.0

      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

      critics: ["PathAlign", "GoalAlign", "PathDist", "GoalDist", "ObstacleFootprint"]
      ObstacleFootprint.scale: 0.02


behavior_server:
  ros__parameters:
    use_sim_time: false

    global_frame: "map"
    robot_base_frame: "base_link"

    # More slack than 0.2
    transform_timeout: 1.0
    simulate_ahead_time: 2.0

    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"


bt_navigator:
  ros__parameters:
    use_sim_time: false

    global_frame: "map"
    robot_base_frame: "base_link"

    # Keep your filtered odom topic
    odom_topic: "/j100_0796/platform/odom/filtered"

    # TF slack
    tf_buffer_duration: 20.0

    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"


waypoint_follower:
  ros__parameters:
    use_sim_time: false


velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: "map"
      robot_base_frame: "base_link"

      update_frequency: 5.0
      publish_frequency: 2.0
      resolution: 0.05

      robot_radius: 0.23
      footprint_padding: 0.01

      rolling_window: false
      track_unknown_space: true

      # TF slack
      transform_tolerance: 1.0
      tf_buffer_duration: 20.0

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan

        scan:
          topic: "/j100_0796/sensors/lidar2d_0/scan"
          data_type: "LaserScan"
          sensor_frame: "lidar2d_0_laser"

          # Good practice for 2D lidars
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0

          obstacle_min_range: 0.05
          obstacle_max_range: 20.0
          raytrace_min_range: 0.05
          raytrace_max_range: 25.0

          clearing: true
          marking: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: "odom"
      robot_base_frame: "base_link"

      update_frequency: 10.0
      publish_frequency: 5.0

      rolling_window: true
      width: 4.0
      height: 4.0
      resolution: 0.05

      robot_radius: 0.23
      footprint_padding: 0.01

      # TF slack
      transform_tolerance: 1.0
      tf_buffer_duration: 20.0

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan

        scan:
          topic: "/j100_0796/sensors/lidar2d_0/scan"
          data_type: "LaserScan"
          sensor_frame: "lidar2d_0_laser"

          min_obstacle_height: 0.0
          max_obstacle_height: 2.0

          obstacle_min_range: 0.05
          obstacle_max_range: 10.0
          raytrace_min_range: 0.05
          raytrace_max_range: 12.0

          clearing: true
          marking: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
