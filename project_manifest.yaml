project:
  name: jackal_clearpath_ws
  description: >
    Custom ROS 2 Humble workspace for Clearpath Jackal with SICK 2D lidar,
    SLAM Toolbox mapping, Nav2 localization, Nav2 navigation, and
    mission orchestration (autonomous + teleop recording pipelines).
  robot:
    platform: Clearpath Jackal
    ros_distro: humble
    namespace: j100_0796
    base_frame: base_link
    odom_frame: odom
    map_frame: map
    lidar_frame: lidar2d_0_laser
    lidar_topic: /j100_0796/sensors/lidar2d_0/scan
    tf_topic: /j100_0796/tf
    tf_static_topic: /j100_0796/tf_static
    cmd_vel_topic: /j100_0796/cmd_vel
    amcl_pose_topic: /j100_0796/amcl_pose
    map_topic_mapping: /map
    map_topic_localization: /j100_0796/map
    nav2_action: /j100_0796/navigate_to_pose

filesystem:
  workspace_root: /home/administrator/jackal_clearpath_ws
  ros_ws: /home/administrator/jackal_clearpath_ws/ros_ws
  package_root: /home/administrator/jackal_clearpath_ws/ros_ws/src/jackal_custom_config
  maps_dir: /home/administrator/jackal_clearpath_ws/maps
  bag_output_dir: /home/administrator/jackal_bags
  active_map_yaml: /home/administrator/jackal_clearpath_ws/maps/map_2.yaml
  active_map_pgm: /home/administrator/jackal_clearpath_ws/maps/map_2.pgm

repository_layout:
  root:
    - .git
    - .gitignore
    - maps/
    - ros_ws/
    - config/
  package:
    - CMakeLists.txt
    - package.xml
    - config/
    - launch/
    - docs/
    - rviz/
    - scripts/
  scripts:
    active:
      - scripts/goal_mission_orchestrator.py
      - scripts/goal_mission_orchestrator_test.py
      - scripts/simple_record_trigger.py
      - scripts/teleop_record_orchestrator.py
      - scripts/keyboard_record_orchestrator.py
    startup:
      - scripts/startup/jackal_startup_legacy.sh

runtime_architecture:
  tf_chain: map -> odom -> base_link -> lidar2d_0_laser

  modes:
    mapping:
      purpose: Build a live occupancy grid map using SLAM Toolbox.

    localization:
      purpose: Localize robot on saved map using AMCL and map_server.

    navigation:
      purpose: Navigate using Nav2 with RViz goal interface.

    autonomous_recording:
      purpose: >
        Execute navigation missions while automatically triggering
        external recording system (Jetson) and recording all ROS topics via rosbag.
      trigger:
        - RViz 2D Goal Pose (remapped to /goal_pose_hijacked)
      sequence:
        - receive hijacked goal
        - send SSH START command
        - wait 10 seconds
        - start rosbag (all topics)
        - publish real goal to /j100_0796/goal_pose
        - send Nav2 action goal
        - wait for navigation completion (action result)
        - stop rosbag
        - send SSH STOP command
      outputs:
        - rosbag directory (unique timestamped)
        - remote camera recording (Jetson)

    teleop_recording:
      purpose: >
        Record data while manually driving robot via joystick.
      trigger:
        - controller button press
      behavior:
        - START → SSH + rosbag
        - STOP → rosbag stop + SSH stop
      independence:
        - does not interfere with /cmd_vel
        - teleop node remains sole velocity publisher

    keyboard_recording:
      purpose: >
        Record data while manually driving robot, with recording
        controlled via keyboard instead of joystick.
      keys:
        start: 's'
        stop: 'x'
        quit: 'q'
      behavior:
        - START → SSH + rosbag
        - STOP → rosbag stop + SSH stop
      notes:
        - non-blocking keyboard input
        - runs alongside teleop node safely

active_files:
  orchestration_main: /home/administrator/jackal_clearpath_ws/ros_ws/src/jackal_custom_config/scripts/goal_mission_orchestrator.py
  orchestration_teleop: /home/administrator/jackal_clearpath_ws/ros_ws/src/jackal_custom_config/scripts/teleop_record_orchestrator.py
  orchestration_keyboard: /home/administrator/jackal_clearpath_ws/ros_ws/src/jackal_custom_config/scripts/keyboard_record_orchestrator.py

bringup:

  autonomous_recording:
    description: Run navigation + automatic recording pipeline
    commands: |
      source ~/.bashrc
      ros2 launch jackal_custom_config nav2_navigation_jackal.launch.py
      ros2 launch jackal_custom_config goal_mission_orchestrator.launch.py
    rviz:
      notes:
        - 2D Goal Pose must publish to /goal_pose_hijacked
    verification: |
      ros2 action list | grep navigate_to_pose
      ros2 topic echo /j100_0796/goal_pose

  teleop_recording:
    description: Manual driving with controller + recording
    commands: |
      source ~/.bashrc
      ros2 run teleop_twist_joy teleop_node
      ros2 run jackal_custom_config teleop_record_orchestrator.py
    workflow:
      - press start button → recording starts
      - drive robot
      - press stop button → recording stops

  keyboard_recording:
    description: Manual driving with keyboard-triggered recording
    commands: |
      source ~/.bashrc
      ros2 run teleop_twist_joy teleop_node
      ros2 run jackal_custom_config keyboard_record_orchestrator.py
    workflow:
      - press 's' → start recording
      - drive robot
      - press 'x' → stop recording

data_management:
  rosbag:
    mode: record_all_topics
    command_pattern: |
      ros2 bag record -a --output <timestamped_folder>
    naming:
      format: mission_YYYYMMDD_HHMMSS_<uuid>
    storage:
      path: /home/administrator/jackal_bags
  transfer:
    method: scp
    example: |
      scp -r administrator@<JACKAL_IP>:/home/administrator/jackal_bags/* ~/Desktop/
  remote_recording:
    protocol: SSH
    jetson_ip: 192.168.5.1
    commands:
      start: touch ~/start.txt  # replace later with real script
      stop: touch ~/stop.txt   # replace later with real script

rviz_notes:
  remap_command: |
    rviz2 --ros-args \
      -r /tf:=/j100_0796/tf \
      -r /tf_static:=/j100_0796/tf_static \
      -r /initialpose:=/j100_0796/initialpose \
      -r /goal_pose:=/j100_0796/goal_pose \
      -r /robot_description:=/j100_0796/robot_description
  notes:
    - RViz does not need local map files
    - map is streamed from robot via topic
    - to change map, modify map_server or call load_map service

map_management:
  switch_map_runtime: |
    ros2 service call /j100_0796/map_server/load_map nav2_msgs/srv/LoadMap "{map_url: /home/administrator/jackal_clearpath_ws/maps/map_306.yaml}"
  alternative_launch_override: |
    ros2 launch jackal_custom_config nav2_localization_jackal.launch.py map:=/home/administrator/jackal_clearpath_ws/maps/map_306.yaml

verification_matrix:
  autonomous_recording_success:
    - SSH START triggered
    - rosbag started
    - goal published to /j100_0796/goal_pose
    - Nav2 action completes
    - rosbag stops
    - SSH STOP triggered

  teleop_recording_success:
    - robot moves via controller
    - recording toggles via button
    - rosbag saved correctly

  keyboard_recording_success:
    - robot moves via controller
    - recording toggles via keyboard
    - no interference with teleop node

operational_notes:
  - Orchestrator nodes do NOT publish /cmd_vel.
  - Navigation completion is detected via Nav2 action, not pose heuristics.
  - All recordings are timestamped and non-overwriting.
  - SSH is configured with key-based authentication (no password).
  - Map switching should be done on robot, not laptop.
  - Teleop and recording systems are fully decoupled.
